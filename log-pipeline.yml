name: HakunaShortcut LOG Pipeline

on:
  push:
    paths:
      - "logs/**/*.md"
  schedule:
    # Runs daily at 09:00 UTC — catches scheduled Substack posts a few
    # hours after they were expected to go live.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      match:
        description: "Text to search for when manually verifying a Substack post (e.g. 'LOG 011' or a title)"
        required: false

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed LOG files
        id: changed
        run: |
          echo "files=$(git diff --name-only HEAD~1 HEAD -- 'logs/**/*.md' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Generate Substack-ready export
        run: |
          for f in ${{ steps.changed.outputs.files }}; do
            echo "Processing $f"
            python3 scripts/prepare_substack.py "$f" || true
          done

      - name: Upload publish-ready output
        uses: actions/upload-artifact@v4
        with:
          name: publish-ready
          path: publish-ready/

  verify:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify latest LOG against Substack RSS feed
        run: |
          MATCH="${{ github.event.inputs.match }}"
          if [ -z "$MATCH" ]; then
            echo "No --match provided for scheduled run; skipping. Use workflow_dispatch with a 'match' input to check a specific LOG."
            exit 0
          fi
          python3 scripts/verify_substack_rss.py --match "$MATCH"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" style="background:#0A0A0A;">

  <!-- Outer glow filter -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle — dark field -->
  <circle cx="200" cy="210" r="175" fill="#0A0A0A" stroke="#00FF41" stroke-width="0.5" opacity="0.3"/>

  <!-- Radar rings — concentric, decreasing opacity -->
  <circle cx="200" cy="210" r="160" fill="none" stroke="#00FF41" stroke-width="0.8" opacity="0.15" filter="url(#glow)"/>
  <circle cx="200" cy="210" r="130" fill="none" stroke="#00FF41" stroke-width="0.8" opacity="0.25" filter="url(#glow)"/>
  <circle cx="200" cy="210" r="100" fill="none" stroke="#00FF41" stroke-width="1" opacity="0.35" filter="url(#glow)"/>
  <circle cx="200" cy="210" r="70"  fill="none" stroke="#00FF41" stroke-width="1" opacity="0.45" filter="url(#glow)"/>
  <circle cx="200" cy="210" r="40"  fill="none" stroke="#00FF41" stroke-width="1.2" opacity="0.6" filter="url(#glow)"/>

  <!-- Outer boundary ring — primary -->
  <circle cx="200" cy="210" r="168" fill="none" stroke="#00FF41" stroke-width="1.5" opacity="0.9" filter="url(#glow)"/>

  <!-- Cardinal crosshair lines -->
  <!-- North -->
  <line x1="200" y1="42" x2="200" y2="170" stroke="#00FF41" stroke-width="1" opacity="0.8" filter="url(#glow)"/>
  <!-- South -->
  <line x1="200" y1="250" x2="200" y2="378" stroke="#00FF41" stroke-width="1" opacity="0.8" filter="url(#glow)"/>
  <!-- West -->
  <line x1="32" y1="210" x2="160" y2="210" stroke="#00FF41" stroke-width="1" opacity="0.8" filter="url(#glow)"/>
  <!-- East -->
  <line x1="240" y1="210" x2="368" y2="210" stroke="#00FF41" stroke-width="1" opacity="0.8" filter="url(#glow)"/>

  <!-- Diagonal bearing lines — lighter -->
  <line x1="80" y1="92" x2="152" y2="164" stroke="#00FF41" stroke-width="0.5" opacity="0.3"/>
  <line x1="320" y1="92" x2="248" y2="164" stroke="#00FF41" stroke-width="0.5" opacity="0.3"/>
  <line x1="80" y1="328" x2="152" y2="256" stroke="#00FF41" stroke-width="0.5" opacity="0.3"/>
  <line x1="320" y1="328" x2="248" y2="256" stroke="#00FF41" stroke-width="0.5" opacity="0.3"/>

  <!-- Radar sweep arc — amber signal -->
  <path d="M200,210 L200,50 A160,160 0 0,1 313,97 Z" fill="#D4A017" opacity="0.06"/>
  <path d="M200,210 L200,50 A160,160 0 0,1 313,97 Z" fill="none" stroke="#D4A017" stroke-width="0.5" opacity="0.4"/>

  <!-- Gate marker — horizontal threshold line at 70% radius -->
  <line x1="80" y1="210" x2="320" y2="210" stroke="#D4A017" stroke-width="0.8" opacity="0.5" stroke-dasharray="4,6"/>

  <!-- Cardinal tick marks on outer ring -->
  <!-- N -->
  <line x1="200" y1="40" x2="200" y2="52" stroke="#00FF41" stroke-width="2" opacity="0.9"/>
  <!-- S -->
  <line x1="200" y1="368" x2="200" y2="380" stroke="#00FF41" stroke-width="2" opacity="0.9"/>
  <!-- E -->
  <line x1="348" y1="210" x2="360" y2="210" stroke="#00FF41" stroke-width="2" opacity="0.9"/>
  <!-- W -->
  <line x1="40" y1="210" x2="52" y2="210" stroke="#00FF41" stroke-width="2" opacity="0.9"/>

  <!-- Small degree markers on outer ring -->
  <circle cx="200" cy="44" r="2" fill="#00FF41" opacity="0.9"/>
  <circle cx="362" cy="210" r="2" fill="#00FF41" opacity="0.9"/>
  <circle cx="200" cy="376" r="2" fill="#00FF41" opacity="0.9"/>
  <circle cx="38" cy="210" r="2" fill="#00FF41" opacity="0.9"/>

  <!-- Centre origin point -->
  <circle cx="200" cy="210" r="4" fill="#00FF41" opacity="0.9" filter="url(#glow)"/>
  <circle cx="200" cy="210" r="10" fill="none" stroke="#00FF41" stroke-width="1" opacity="0.6" filter="url(#glow)"/>
  <circle cx="200" cy="210" r="18" fill="none" stroke="#00FF41" stroke-width="0.8" opacity="0.4"/>

  <!-- Active signal node — amber -->
  <circle cx="260" cy="155" r="3" fill="#D4A017" opacity="0.9" filter="url(#softglow)"/>
  <circle cx="260" cy="155" r="8" fill="none" stroke="#D4A017" stroke-width="0.8" opacity="0.5"/>

  <!-- Second node — fainter -->
  <circle cx="148" cy="268" r="2" fill="#00FF41" opacity="0.6" filter="url(#glow)"/>

  <!-- Corner bracket marks — field intelligence aesthetic -->
  <!-- Top left -->
  <path d="M36,60 L36,44 L52,44" fill="none" stroke="#00FF41" stroke-width="1" opacity="0.5"/>
  <!-- Top right -->
  <path d="M364,60 L364,44 L348,44" fill="none" stroke="#00FF41" stroke-width="1" opacity="0.5"/>
  <!-- Bottom left -->
  <path d="M36,360 L36,376 L52,376" fill="none" stroke="#00FF41" stroke-width="1" opacity="0.5"/>
  <!-- Bottom right -->
  <path d="M364,360 L364,376 L348,376" fill="none" stroke="#00FF41" stroke-width="1" opacity="0.5"/>

  <!-- Separator line above text -->
  <line x1="60" y1="400" x2="340" y2="400" stroke="#00FF41" stroke-width="0.5" opacity="0.4"/>

  <!-- Primary wordmark -->
  <text
    x="200"
    y="428"
    font-family="'Courier New', Courier, monospace"
    font-size="22"
    font-weight="700"
    letter-spacing="6"
    text-anchor="middle"
    fill="#00FF41"
    opacity="0.95"
    filter="url(#glow)">HAKUNASHORTCUT</text>

  <!-- Subtext — coordinates -->
  <text
    x="200"
    y="452"
    font-family="'Courier New', Courier, monospace"
    font-size="8"
    letter-spacing="3"
    text-anchor="middle"
    fill="#00FF41"
    opacity="0.45">NORTH KINANGOP // DIGITAL FRONTIER</text>

</svg>
